<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>Dashboard Raph</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiRGFzaGJvYXJkIFJhcGgiLCJzaG9ydF9uYW1lIjoiRGFzaGJvYXJkIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzBhMGEwZiIsInRoZW1lX2NvbG9yIjoiIzBhMGEwZiJ9">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0f;
  --card: #13131a;
  --card-border: #1e1e2a;
  --text: #e8e8ed;
  --text-dim: #6b6b80;
  --accent: #6366f1;
  --accent-glow: rgba(99, 102, 241, 0.15);
  --success: #22c55e;
  --warn: #f59e0b;
  --radius: 16px;
}

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.dashboard {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: auto 1fr auto;
  gap: 12px;
  padding: 16px;
  min-height: 100vh;
  max-width: 1400px;
  margin: 0 auto;
}

.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 20px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
}
.card:hover { border-color: #2a2a3a; }

.card-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-dim);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.card-label .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* === CLOCK === */
.clock-card {
  grid-column: 1 / 3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(135deg, var(--card) 0%, #181825 100%);
}
.clock-time {
  font-size: 72px;
  font-weight: 300;
  letter-spacing: -2px;
  line-height: 1;
}
.clock-time .seconds {
  font-size: 28px;
  color: var(--text-dim);
  font-weight: 400;
}
.clock-right { text-align: right; }
.clock-date {
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 4px;
}
.clock-greeting {
  font-size: 14px;
  color: var(--text-dim);
}

/* === WEATHER === */
.weather-card {
  grid-column: 3;
  grid-row: 1 / 3;
  display: flex;
  flex-direction: column;
}
.weather-now {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.weather-icon { font-size: 48px; line-height: 1; }
.weather-temp { font-size: 42px; font-weight: 300; }
.weather-temp .unit { font-size: 20px; color: var(--text-dim); }
.weather-details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 20px;
}
.weather-detail { font-size: 12px; color: var(--text-dim); }
.weather-detail span { color: var(--text); font-weight: 500; }
.weather-forecast {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}
.forecast-day {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
  border-top: 1px solid var(--card-border);
  font-size: 13px;
}
.forecast-day .day-name { width: 60px; color: var(--text-dim); }
.forecast-day .day-icon { font-size: 18px; width: 30px; text-align: center; }
.forecast-day .day-temps { text-align: right; }
.forecast-day .day-temps .hi { font-weight: 500; }
.forecast-day .day-temps .lo { color: var(--text-dim); margin-left: 6px; }

/* === CALENDAR === */
.calendar-card {
  grid-column: 1 / 3;
  min-height: 280px;
}
.events-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.event-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: rgba(255,255,255,0.02);
  border-radius: 10px;
  border-left: 3px solid var(--accent);
  transition: background 0.2s;
}
.event-item:hover { background: rgba(255,255,255,0.04); }
.event-time {
  font-size: 13px;
  font-weight: 600;
  min-width: 55px;
  color: var(--accent);
}
.event-title { font-size: 14px; font-weight: 500; }
.event-loc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.event-empty {
  color: var(--text-dim);
  font-size: 14px;
  padding: 20px 0;
  text-align: center;
}

/* === LED CONTROL === */
.led-card { grid-column: 1 / 2; }
.color-wheel-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.color-wheel {
  width: 180px; height: 180px;
  border-radius: 50%;
  background: conic-gradient(
    hsl(0,100%,50%), hsl(30,100%,50%), hsl(60,100%,50%),
    hsl(90,100%,50%), hsl(120,100%,50%), hsl(150,100%,50%),
    hsl(180,100%,50%), hsl(210,100%,50%), hsl(240,100%,50%),
    hsl(270,100%,50%), hsl(300,100%,50%), hsl(330,100%,50%),
    hsl(360,100%,50%)
  );
  cursor: pointer;
  position: relative;
  border: 3px solid var(--card-border);
  transition: border-color 0.3s;
  touch-action: none;
}
.color-wheel:hover { border-color: #3a3a4a; }
.color-wheel::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle, white 0%, transparent 70%);
}
.color-indicator {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 3px solid white;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
  pointer-events: none;
  box-shadow: 0 0 10px rgba(0,0,0,0.6);
  transition: top 0.05s, left 0.05s;
}
.color-preview {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
}
.color-swatch {
  width: 40px; height: 40px;
  border-radius: 10px;
  border: 2px solid var(--card-border);
  transition: background-color 0.3s, box-shadow 0.3s;
}
.color-hex {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 14px;
  color: var(--text-dim);
}
.led-presets {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  width: 100%;
  margin-top: 4px;
}
.led-preset {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 10px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.2s;
}
.led-preset:hover { transform: scale(1.1); border-color: rgba(255,255,255,0.3); }
.led-preset.active { border-color: white; }
.brightness-container { width: 100%; margin-top: 4px; }
.brightness-label {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}
.brightness-slider {
  -webkit-appearance: none;
  width: 100%;
  height: 8px;
  border-radius: 4px;
  background: linear-gradient(90deg, #1a1a2e, var(--accent));
  outline: none;
}
.brightness-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: white;
  cursor: pointer;
  box-shadow: 0 0 8px rgba(0,0,0,0.3);
}
.led-status {
  font-size: 12px;
  text-align: center;
  margin-top: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  font-weight: 500;
}

/* === QUICK ACTIONS === */
.actions-card {
  grid-column: 2 / 4;
  display: flex;
  flex-direction: column;
}
.actions-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  flex: 1;
}
.action-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 16px;
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.action-btn:active { transform: scale(0.95); }
.action-btn:hover { background: rgba(255,255,255,0.05); border-color: var(--accent); }
.action-btn .action-icon { font-size: 32px; }
.action-btn.led-on { border-color: var(--success); color: var(--success); }
.action-btn.led-on:hover { background: rgba(34,197,94,0.1); }
.action-btn.led-off { border-color: #ef4444; color: #ef4444; }
.action-btn.led-off:hover { background: rgba(239,68,68,0.1); }

/* === CONFIG MODAL === */
.config-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(8px);
}
.config-modal.open { display: flex; }
.config-content {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 28px;
  width: 90%;
  max-width: 400px;
}
.config-content h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.config-input {
  width: 100%;
  padding: 14px;
  background: var(--bg);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  margin-bottom: 10px;
  outline: none;
}
.config-input:focus { border-color: var(--accent); }
.config-input::placeholder { color: var(--text-dim); }
.config-buttons { display: flex; gap: 8px; margin-top: 16px; }
.config-btn {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--card-border);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.config-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
.config-btn.secondary { background: transparent; color: var(--text-dim); }

/* Responsive tablet */
@media (max-width: 900px) {
  .dashboard { grid-template-columns: 1fr 1fr; grid-template-rows: auto; }
  .clock-card { grid-column: 1 / 3; }
  .weather-card { grid-column: 1 / 3; grid-row: auto; }
  .calendar-card { grid-column: 1 / 3; }
  .led-card { grid-column: 1; }
  .actions-card { grid-column: 2; }
  .clock-time { font-size: 56px; }
}
@media (max-width: 600px) {
  .dashboard { grid-template-columns: 1fr; gap: 10px; padding: 10px; }
  .clock-card, .weather-card, .calendar-card, .led-card, .actions-card { grid-column: 1; }
  .clock-time { font-size: 44px; }
  .actions-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="dashboard">

  <!-- CLOCK -->
  <div class="card clock-card">
    <div class="clock-left">
      <div class="clock-time" id="clock">
        <span id="hours">--</span>:<span id="minutes">--</span><span class="seconds" id="seconds">:--</span>
      </div>
    </div>
    <div class="clock-right">
      <div class="clock-date" id="date">--</div>
      <div class="clock-greeting" id="greeting">--</div>
    </div>
  </div>

  <!-- WEATHER -->
  <div class="card weather-card">
    <div class="card-label"><span class="dot"></span> Météo Tours</div>
    <div class="weather-now">
      <div class="weather-icon" id="weather-icon">--</div>
      <div class="weather-temp"><span id="temp">--</span><span class="unit">°C</span></div>
    </div>
    <div class="weather-details">
      <div class="weather-detail">Ressenti <span id="feels">--°</span></div>
      <div class="weather-detail">Humidité <span id="humidity">--%</span></div>
      <div class="weather-detail">Vent <span id="wind">-- km/h</span></div>
      <div class="weather-detail">UV <span id="uv">--</span></div>
    </div>
    <div class="weather-forecast" id="forecast"></div>
  </div>

  <!-- CALENDAR -->
  <div class="card calendar-card">
    <div class="card-label"><span class="dot"></span> Aujourd'hui</div>
    <div class="events-list" id="events">
      <div class="event-empty">Chargement...</div>
    </div>
  </div>

  <!-- LED CONTROL -->
  <div class="card led-card">
    <div class="card-label"><span class="dot"></span> LEDs Govee</div>
    <div class="color-wheel-container">
      <div class="color-wheel" id="colorWheel">
        <div class="color-indicator" id="colorIndicator"></div>
      </div>
      <div class="color-preview">
        <div class="color-swatch" id="colorSwatch" style="background:#6366f1; box-shadow: 0 0 20px rgba(99,102,241,0.4);"></div>
        <span class="color-hex" id="colorHex">#6366F1</span>
      </div>
      <div class="led-presets" id="presets"></div>
      <div class="brightness-container">
        <div class="brightness-label">
          <span>Luminosité</span>
          <span id="brightnessVal">100%</span>
        </div>
        <input type="range" class="brightness-slider" id="brightness" min="0" max="100" value="100">
      </div>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;" id="ledDeviceName"></div>
      <div class="led-status" id="ledStatus" style="color:var(--accent);background:var(--accent-glow);">🔍 Détection des LEDs...</div>
    </div>
  </div>

  <!-- QUICK ACTIONS -->
  <div class="card actions-card">
    <div class="card-label"><span class="dot"></span> Actions rapides</div>
    <div class="actions-grid">
      <button class="action-btn" onclick="setScene('warm')">
        <span class="action-icon">🌅</span> Warm
      </button>
      <button class="action-btn" onclick="setScene('focus')">
        <span class="action-icon">💡</span> Focus
      </button>
      <button class="action-btn" onclick="setScene('chill')">
        <span class="action-icon">🌙</span> Chill
      </button>
      <button class="action-btn" onclick="setScene('party')">
        <span class="action-icon">🎉</span> Party
      </button>
      <button class="action-btn led-on" onclick="ledsOn()">
        <span class="action-icon">💡</span> LEDs On
      </button>
      <button class="action-btn led-off" onclick="ledsOff()">
        <span class="action-icon">⭘</span> LEDs Off
      </button>
      <button class="action-btn" onclick="openConfig()">
        <span class="action-icon">⚙️</span> Config
      </button>
      <button class="action-btn" onclick="location.reload()">
        <span class="action-icon">🔄</span> Refresh
      </button>
      <button class="action-btn" onclick="toggleFullscreen()">
        <span class="action-icon">⛶</span> Plein écran
      </button>
    </div>
  </div>

</div>

<!-- CONFIG MODAL -->
<div class="config-modal" id="configModal">
  <div class="config-content">
    <h3>⚙️ Configuration Govee</h3>
    <input class="config-input" id="apiKeyInput" type="text" placeholder="Clé API Govee">
    <input class="config-input" id="deviceIdInput" placeholder="ID appareil (auto-détecté si vide)">
    <input class="config-input" id="modelInput" placeholder="Modèle / SKU (auto-détecté si vide)">
    <p style="font-size:12px;color:var(--text-dim);margin-top:8px;">
      App Govee → Profil → ⚙️ → Apply for API Key
    </p>
    <div class="config-buttons">
      <button class="config-btn secondary" onclick="closeConfig()">Annuler</button>
      <button class="config-btn primary" onclick="saveConfig()">Sauvegarder</button>
    </div>
  </div>
</div>

<script>
// ===== GOVEE CONFIG =====
const GOVEE_PROXY = 'https://corsproxy.io/?url=';
const GOVEE_BASE = 'https://openapi.api.govee.com/router/api/v1';

let goveeApiKey = localStorage.getItem('govee_api_key') || '36904506-914b-41bd-a72c-705b84a64295';
let goveeDeviceId = localStorage.getItem('govee_device_id') || '';
let goveeModel = localStorage.getItem('govee_model') || '';
let currentColor = { r: 99, g: 102, b: 241 };

// ===== CLOCK =====
function updateClock() {
  const now = new Date();
  document.getElementById('hours').textContent = String(now.getHours()).padStart(2, '0');
  document.getElementById('minutes').textContent = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('seconds').textContent = ':' + String(now.getSeconds()).padStart(2, '0');

  const days = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const months = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  document.getElementById('date').textContent = days[now.getDay()] + ' ' + now.getDate() + ' ' + months[now.getMonth()];

  const h = now.getHours();
  let g = 'Bonne nuit, Raph';
  if (h >= 6 && h < 12) g = 'Bonjour, Raph ☀️';
  else if (h >= 12 && h < 18) g = 'Bon après-midi, Raph';
  else if (h >= 18 && h < 22) g = 'Bonne soirée, Raph 🌙';
  document.getElementById('greeting').textContent = g;
}
setInterval(updateClock, 1000);
updateClock();

// ===== WEATHER (Open-Meteo, Tours) =====
const WMO = {0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',51:'🌦',53:'🌦',55:'🌧',61:'🌧',63:'🌧',65:'🌧️',71:'🌨',73:'🌨',75:'❄️',80:'🌦',81:'🌧',82:'⛈',95:'⛈',96:'⛈',99:'⛈'};
const DAYS_SHORT = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

async function loadWeather() {
  try {
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=47.39&longitude=0.69&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,uv_index&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe/Paris&forecast_days=5');
    const d = await r.json();
    const c = d.current;
    document.getElementById('temp').textContent = Math.round(c.temperature_2m);
    document.getElementById('weather-icon').textContent = WMO[c.weather_code] || '🌡';
    document.getElementById('feels').textContent = Math.round(c.apparent_temperature) + '°';
    document.getElementById('humidity').textContent = c.relative_humidity_2m + '%';
    document.getElementById('wind').textContent = Math.round(c.wind_speed_10m) + ' km/h';
    document.getElementById('uv').textContent = Math.round(c.uv_index);

    const fg = document.getElementById('forecast');
    fg.innerHTML = '';
    for (let i = 1; i < d.daily.time.length; i++) {
      const dt = new Date(d.daily.time[i] + 'T00:00');
      const div = document.createElement('div');
      div.className = 'forecast-day';
      div.innerHTML = '<span class="day-name">' + DAYS_SHORT[dt.getDay()] + '</span>'
        + '<span class="day-icon">' + (WMO[d.daily.weather_code[i]] || '🌡') + '</span>'
        + '<span class="day-temps"><span class="hi">' + Math.round(d.daily.temperature_2m_max[i]) + '°</span>'
        + '<span class="lo">' + Math.round(d.daily.temperature_2m_min[i]) + '°</span></span>';
      fg.appendChild(div);
    }
  } catch(e) {
    document.getElementById('temp').textContent = '--';
  }
}
loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);

// ===== CALENDAR (placeholder) =====
function loadCalendarEvents() {
  const el = document.getElementById('events');
  const h = new Date().getHours();
  if (h < 8) {
    el.innerHTML = '<div class="event-empty">☀️ Ta journée commence bientôt</div>';
  } else if (h > 20) {
    el.innerHTML = '<div class="event-empty">🌙 Journée terminée, repose-toi bien</div>';
  } else {
    el.innerHTML = '<div class="event-empty">📅 Calendrier pas encore connecté</div>';
  }
}
loadCalendarEvents();

// ===== GOVEE API =====
async function goveeRequest(endpoint, body) {
  const url = GOVEE_PROXY + encodeURIComponent(GOVEE_BASE + endpoint);
  const opts = {
    method: body ? 'POST' : 'GET',
    headers: { 'Govee-API-Key': goveeApiKey, 'Content-Type': 'application/json' }
  };
  if (body) opts.body = JSON.stringify(body);
  return fetch(url, opts);
}

function updateLedStatus(status, msg) {
  const el = document.getElementById('ledStatus');
  const styles = {
    connected: ['✅ Connecté', 'var(--success)', 'rgba(34,197,94,0.1)'],
    detecting: ['🔍 Détection des LEDs...', 'var(--accent)', 'var(--accent-glow)'],
    sending:   ['📡 Envoi...', 'var(--accent)', 'var(--accent-glow)'],
    error:     ['❌ Erreur de connexion', '#ef4444', 'rgba(239,68,68,0.1)'],
    nokey:     ['⚙️ Clé API requise', 'var(--warn)', 'rgba(245,158,11,0.1)']
  };
  const s = styles[status] || styles.error;
  el.textContent = msg || s[0];
  el.style.color = s[1];
  el.style.background = s[2];
}

async function detectDevices() {
  if (!goveeApiKey) { updateLedStatus('nokey'); return false; }
  try {
    updateLedStatus('detecting');
    const res = await goveeRequest('/user/devices');
    if (!res.ok) { updateLedStatus('error', '❌ API erreur ' + res.status); return false; }
    const data = await res.json();
    if (data.data && data.data.length > 0) {
      const dev = data.data[0];
      goveeDeviceId = dev.device;
      goveeModel = dev.sku;
      localStorage.setItem('govee_device_id', goveeDeviceId);
      localStorage.setItem('govee_model', goveeModel);
      document.getElementById('ledDeviceName').textContent = (dev.deviceName || dev.sku);
      updateLedStatus('connected', '✅ ' + (dev.deviceName || dev.sku));
      return true;
    } else {
      updateLedStatus('error', '❌ Aucun appareil trouvé');
      return false;
    }
  } catch(e) {
    updateLedStatus('error', '❌ ' + e.message);
    return false;
  }
}

async function sendToGovee(r, g, b) {
  if (!goveeApiKey || !goveeDeviceId) return;
  try {
    updateLedStatus('sending');
    const res = await goveeRequest('/device/control', {
      requestId: 'color-' + Date.now(),
      payload: { sku: goveeModel, device: goveeDeviceId,
        capability: { type: 'devices.capabilities.color_setting', instance: 'colorRgb', value: (r << 16) + (g << 8) + b }
      }
    });
    if (res.ok) updateLedStatus('connected');
    else updateLedStatus('error', '❌ Erreur ' + res.status);
  } catch(e) { updateLedStatus('error', '❌ ' + e.message); }
}

async function sendBrightnessToGovee(val) {
  if (!goveeApiKey || !goveeDeviceId) return;
  try {
    await goveeRequest('/device/control', {
      requestId: 'bright-' + Date.now(),
      payload: { sku: goveeModel, device: goveeDeviceId,
        capability: { type: 'devices.capabilities.range', instance: 'brightness', value: val }
      }
    });
  } catch(e) {}
}

async function ledsOff() {
  if (!goveeApiKey || !goveeDeviceId) { openConfig(); return; }
  try {
    await goveeRequest('/device/control', {
      requestId: 'off-' + Date.now(),
      payload: { sku: goveeModel, device: goveeDeviceId,
        capability: { type: 'devices.capabilities.on_off', instance: 'powerSwitch', value: 0 }
      }
    });
    updateLedStatus('connected', '💤 LEDs éteintes');
  } catch(e) {}
}

async function ledsOn() {
  if (!goveeApiKey || !goveeDeviceId) { openConfig(); return; }
  try {
    await goveeRequest('/device/control', {
      requestId: 'on-' + Date.now(),
      payload: { sku: goveeModel, device: goveeDeviceId,
        capability: { type: 'devices.capabilities.on_off', instance: 'powerSwitch', value: 1 }
      }
    });
    updateLedStatus('connected', '✅ LEDs allumées');
  } catch(e) {}
}

function setScene(name) {
  const scenes = { warm:'#FF9500', focus:'#E8E8E8', chill:'#5856D6', party:'#FF2D55' };
  if (scenes[name]) { ledsOn().then(() => selectPresetColor(scenes[name])); }
}

// ===== PRESETS =====
const presetColors = ['#FF3B30','#FF9500','#FFCC00','#34C759','#007AFF','#AF52DE','#FF2D55','#5856D6','#00C7BE','#FF6B6B','#E8E8E8','#6366F1'];

function initPresets() {
  const container = document.getElementById('presets');
  presetColors.forEach(c => {
    const btn = document.createElement('div');
    btn.className = 'led-preset';
    btn.style.background = c;
    btn.onclick = () => selectPresetColor(c);
    container.appendChild(btn);
  });
}
initPresets();

function selectPresetColor(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  currentColor = {r,g,b};
  updateColorUI(hex);
  sendToGovee(r, g, b);
}

function updateColorUI(hex) {
  document.getElementById('colorSwatch').style.background = hex;
  document.getElementById('colorSwatch').style.boxShadow = '0 0 20px ' + hex + '66';
  document.getElementById('colorHex').textContent = hex.toUpperCase();
}

function rgbToHex(r,g,b) { return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('').toUpperCase(); }

// ===== COLOR WHEEL =====
const wheel = document.getElementById('colorWheel');
const indicator = document.getElementById('colorIndicator');
let wheelDragging = false;
let sendTimeout = null;

function getColorFromWheel(e) {
  const rect = wheel.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const touch = e.touches ? e.touches[0] : e;
  const x = touch.clientX - rect.left - cx, y = touch.clientY - rect.top - cy;
  const angle = Math.atan2(y, x) * (180 / Math.PI) + 180;
  const dist = Math.min(Math.sqrt(x*x + y*y), cx);
  const sat = (dist / cx) * 100;
  const rgb = hslToRgb(angle, sat, 50);
  currentColor = { r: rgb[0], g: rgb[1], b: rgb[2] };
  const hex = rgbToHex(rgb[0], rgb[1], rgb[2]);
  updateColorUI(hex);
  indicator.style.left = (x + cx) + 'px';
  indicator.style.top = (y + cy) + 'px';
  indicator.style.transform = 'translate(-50%,-50%)';
  indicator.style.background = hex;
}

function hslToRgb(h, s, l) {
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h / 30) % 12; return l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1); };
  return [Math.round(f(0)*255), Math.round(f(8)*255), Math.round(f(4)*255)];
}

wheel.addEventListener('pointerdown', e => {
  wheelDragging = true;
  wheel.setPointerCapture(e.pointerId);
  getColorFromWheel(e);
});
wheel.addEventListener('pointermove', e => {
  if (wheelDragging) getColorFromWheel(e);
});
wheel.addEventListener('pointerup', e => {
  if (wheelDragging) {
    wheelDragging = false;
    sendToGovee(currentColor.r, currentColor.g, currentColor.b);
  }
});

// ===== BRIGHTNESS =====
document.getElementById('brightness').addEventListener('input', e => {
  document.getElementById('brightnessVal').textContent = e.target.value + '%';
});
document.getElementById('brightness').addEventListener('change', e => {
  sendBrightnessToGovee(parseInt(e.target.value));
});

// ===== CONFIG MODAL =====
function openConfig() {
  document.getElementById('configModal').classList.add('open');
  document.getElementById('apiKeyInput').value = goveeApiKey;
  document.getElementById('deviceIdInput').value = goveeDeviceId;
  document.getElementById('modelInput').value = goveeModel;
}
function closeConfig() { document.getElementById('configModal').classList.remove('open'); }

async function saveConfig() {
  goveeApiKey = document.getElementById('apiKeyInput').value.trim();
  localStorage.setItem('govee_api_key', goveeApiKey);
  const devInput = document.getElementById('deviceIdInput').value.trim();
  const modInput = document.getElementById('modelInput').value.trim();

  if (!devInput && goveeApiKey) {
    closeConfig();
    await detectDevices();
  } else if (devInput) {
    goveeDeviceId = devInput;
    goveeModel = modInput;
    localStorage.setItem('govee_device_id', goveeDeviceId);
    localStorage.setItem('govee_model', goveeModel);
    updateLedStatus('connected');
    closeConfig();
  }
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}

// ===== INIT =====
if (goveeApiKey && !goveeDeviceId) {
  detectDevices();
} else if (goveeApiKey && goveeDeviceId) {
  updateLedStatus('connected');
  document.getElementById('ledDeviceName').textContent = goveeModel;
} else {
  updateLedStatus('nokey');
}

// Keep screen on (if supported)
if ('wakeLock' in navigator) {
  navigator.wakeLock.request('screen').catch(()=>{});
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(()=>{});
  });
}
</script>
